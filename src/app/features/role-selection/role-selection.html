<div class="flex flex-col items-center justify-center h-screen w-screen bg-background">
  <div class="flex flex-col items-center gap-3 mb-16">
    <h1 class="text-5xl font-bold text-foreground tracking-tight">Health Dashboard</h1>
    <p class="text-lg text-foreground/70">Select your role to get started</p>
  </div>
  <div class="flex flex-row items-center gap-4">
    @for (role of roles; track $index) {
    <div
      class="flex flex-col items-center p-8 overflow-hidden rounded-xl bg-surface border border-border cursor-pointer hover:border-[#008d9b] hover:bg-surface/50"
      (click)="onRoleSelect(role)">
      <div class="flex items-center justify-center p-3 bg-[#008d9b]/20 rounded-lg mb-4">
        <svg appIcon class="close-icon" [name]="role.icon" size="24" color="#008d9b"></svg>
      </div>
      <h2 class="text-2xl font-semibold text-foreground mb-2">{{ role.name }}</h2>
      <p class="text-sm text-foreground/70 mb-6">{{ role.desc }}</p>
      <button matButton>
        <div class="flex flex-row gap-2 items-center">
          <span>Enter Dashboard</span>
          <svg appIcon class="close-icon" name="arrowRight" size="16"></svg>
        </div>
      </button>
    </div>
    }
  </div>
</div>
